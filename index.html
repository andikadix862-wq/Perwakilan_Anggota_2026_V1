    <script>
      // Suppress benign Vite HMR websocket disconnection / closed without opened notifications in sandbox container
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          /websocket|closed without opened|failed to connect/i.test(msg)
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
        if (
          /websocket|closed without opened|failed to connect/i.test(msg)
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
